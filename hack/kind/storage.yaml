apiVersion: v1
kind: PersistentVolume
metadata:
  name: crater-kind-rw-storage
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: crater-kind-hostpath
  hostPath:
    path: /var/local-path-provisioner/crater-agent
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crater-rw-storage
  namespace: crater-workspace
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: crater-kind-hostpath
  resources:
    requests:
      storage: 10Gi
