name: Validate Helm Chart

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/helm-chart-validate.yml"

jobs:
  validate-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PR merge baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Checked-out SHA: $ACTUAL_SHA"
          echo "Expected checkout SHA: $CHECKOUT_SHA"
          echo "Fixed base SHA: $BASE_SHA"
          read -r -a PARENTS <<< "$(git rev-list --parents -n 1 HEAD)"
          if [[ "$ACTUAL_SHA" != "$CHECKOUT_SHA" || "${#PARENTS[@]}" -ne 3 ]]; then
            echo "::error::Expected the PR synthetic merge commit at $CHECKOUT_SHA; got $ACTUAL_SHA with $((${#PARENTS[@]} - 1)) parents."
            exit 1
          fi
          echo "Merge first parent: ${PARENTS[1]}"
          if [[ "${PARENTS[1]}" != "$BASE_SHA" ]]; then
            echo "::error::PR base SHA $BASE_SHA does not match merge first parent ${PARENTS[1]} at $ACTUAL_SHA."
            exit 1
          fi

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Validate Chart Syntax
        run: |
          cd charts
          helm lint crater/
          helm template crater crater/ --dry-run

      - name: Check Chart Version Update
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          bash charts/hack/check-chart-version.sh --base "$BASE_SHA"

      - name: Package Chart (Test)
        run: |
          cd charts
          # 先通过 lint 校验 Chart 合法性（语法、依赖、模板等）
          helm lint crater/ 
          # 再执行打包（可选保留或删除文件）
          helm package crater/
          echo "✅ Chart packaging test completed successfully"
          # 可选：删除打包文件（仅测试用，不保留）
          rm -f crater-*.tgz
