name: Publish Helm Chart

on:
  push:
    branches: [main]
    # GitHub does not evaluate path filters for tag pushes.
    tags:
      - "v*.*.*"
    paths:
      - "charts/**"
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  REPOSITORY: raids-lab

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release-version
        if: github.ref_type == 'tag'
        run: bash hack/set-build-version.sh

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push Helm Chart
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.app_version }}
        run: |
          # Navigate to charts directory
          cd charts

          # Package the chart
          helm package crater/

          # Get the chart and application versions from Chart.yaml
          CHART_METADATA=$(helm show chart crater/)
          CHART_VERSION=$(awk '$1 == "version:" { print $2 }' <<<"$CHART_METADATA")
          CHART_APP_VERSION=$(awk '$1 == "appVersion:" { print $2 }' <<<"$CHART_METADATA")
          echo "Chart version: $CHART_VERSION"
          echo "Chart appVersion: $CHART_APP_VERSION"

          if [[ -n "$RELEASE_VERSION" && "$CHART_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Release tag version $RELEASE_VERSION does not match Chart version $CHART_VERSION" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_VERSION" && "$CHART_APP_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Release tag version $RELEASE_VERSION does not match Chart appVersion $CHART_APP_VERSION" >&2
            exit 1
          fi

          # Push to GHCR OCI registry
          helm push crater-${CHART_VERSION}.tgz oci://${{ env.REGISTRY }}/${{ env.REPOSITORY }}

          echo "Successfully published Helm chart crater:${CHART_VERSION} to ${{ env.REGISTRY }}/${{ env.REPOSITORY }}"

  cleanup-old-versions:
    runs-on: ubuntu-latest
    needs: publish-chart
    if: success()
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clean up old chart versions
        uses: quartx-analytics/ghcr-cleaner@v1
        with:
          owner-type: org
          token: ${{ secrets.PAT_TOKEN }}
          repository-owner: ${{ github.repository_owner }}
          package-name: crater
          delete-untagged: true
          keep-at-most: 10
          skip-tags: latest
        continue-on-error: true
