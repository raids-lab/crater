name: Crater-Agent Build

on:
  pull_request:
    branches: [main]
    paths:
      - "crater-agent/**"
      - "hack/local/**"
      - "hack/kind/**"
      - ".github/workflows/crater-agent-build.yml"
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - "crater-agent/**"
      - "hack/local/**"
      - "hack/kind/**"
      - ".github/workflows/crater-agent-build.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: raids-lab/crater-agent

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crater-agent
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crater-agent/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - name: Build container image
        working-directory: .
        run: docker build --tag crater-agent:pr-check crater-agent
      - name: Validate deployment scripts
        working-directory: .
        run: for script in hack/local/*.sh hack/kind/*.sh; do bash -n "$script"; done
      - name: Validate local Compose configuration
        working-directory: .
        env:
          CRATER_AGENT_INTERNAL_TOKEN: ci-agent-internal-token-at-least-32-characters
          CRATER_AGENT_CONTEXT_SIGNING_KEY: ci-agent-context-signing-key-at-least-32-characters
          SYSTEM_SECRET_KEY: ci-system-key-32-characters-long
          CRATER_LOCAL_BACKEND_CONFIG: /tmp/config.yaml
          CRATER_LOCAL_KUBECONFIG: /tmp/kubeconfig
        run: docker compose --file hack/local/compose.yaml config --quiet

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: crater-agent
          file: crater-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
