name: Backend PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "hack/set-build-version.sh"
      - ".github/workflows/backend-pr.yml"

env:
  GOLANGCI_LINT_VERSION: v2.6.2

jobs:
  backend-lint-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "backend/go.mod"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: |
          go env -w GO111MODULE=on
          go env -w GOPROXY=https://goproxy.cn,direct
          go mod download

      - name: Prepare upstream base for lint-diff
        run: |
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/raids-lab/crater.git
          fi
          git fetch upstream main --depth=1

      - name: Run make lint
        run: make lint

      - name: Test pagination handlers and contracts
        run: |
          export GIN_MODE=debug CRATER_DEBUG_CONFIG_PATH="$PWD/etc/example-config.yaml"
          go test -count=1 ./internal/handler ./internal/handler/image ./internal/handler/operations \
            ./internal/pagination ./internal/resputil ./internal/service/jobtemplate ./internal/version

      - name: Test TensorBoard launcher
        run: make test-tensorboard-launcher

      - name: Test job session and browser compatibility
        run: make test-job-sessions

  backend-build-check:
    runs-on: ubuntu-latest
    needs: backend-lint-check
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "backend/go.mod"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: |
          go env -w GO111MODULE=on
          go env -w GOPROXY=https://goproxy.cn,direct
          go mod download

      - name: Swag
        run: make docs
        shell: bash

      - name: Set version variables
        id: set-version
        run: bash ../hack/set-build-version.sh

      - name: Build backend binaries
        run: |
          mkdir -p bin/linux_amd64
          go build -ldflags="-X main.AppVersion=${{ steps.set-version.outputs.app_version }} -X main.CommitSHA=${{ steps.set-version.outputs.commit_sha }} -X main.BuildType=${{ steps.set-version.outputs.build_type }} -X main.BuildTime=${{ steps.set-version.outputs.build_time }} -w -s" -o bin/linux_amd64/migrate cmd/gorm-gen/models/migrate.go
          go build -ldflags="-X main.AppVersion=${{ steps.set-version.outputs.app_version }} -X main.CommitSHA=${{ steps.set-version.outputs.commit_sha }} -X main.BuildType=${{ steps.set-version.outputs.build_type }} -X main.BuildTime=${{ steps.set-version.outputs.build_time }} -w -s" -o bin/linux_amd64/controller cmd/crater/main.go
        env:
          CGO_ENABLED: 0

  dataset-postgres-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crater_test
          POSTGRES_DB: crater_pagination_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crater_test -d crater_pagination_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test dataset lists on SQLite
        run: GIN_MODE=debug CRATER_DEBUG_CONFIG_PATH="$PWD/etc/example-config.yaml" go test ./internal/service/dataset -count=1 -v
      - name: Test dataset lists on PostgreSQL 16
        env:
          CRATER_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=crater_test dbname=crater_pagination_test sslmode=disable
        run: make test-dataset-postgres
