name: CLI PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-pr.yml"

permissions:
  contents: read

concurrency:
  group: cli-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cli-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Check Go version
        run: go version
      - name: Unit tests and bilingual snapshots
        run: make pre-commit-check
      - name: Race checks
        run: go test -race ./cmd ./internal/api -count=1
      - name: Static analysis
        run: go vet ./...
      - name: Build
        run: make build
      - name: Check dependency files are tidy
        run: git diff --exit-code -- go.mod go.sum
