name: CLI PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "hack/set-build-version.sh"
      - ".github/workflows/cli-pr.yml"
      - ".github/workflows/cli-release.yml"

permissions:
  contents: read

jobs:
  check-cli:
    name: Check CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "cli/go.mod"
          cache-dependency-path: cli/go.sum

      - name: Download Go dependencies
        working-directory: cli
        run: go mod download

      - name: Run CLI tests
        working-directory: cli
        run: make test

  check-npm-packaging:
    name: Check npm packaging
    needs: check-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set version variables
        id: version
        run: bash hack/set-build-version.sh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test npm packaging scripts
        working-directory: cli/npm
        run: npm test

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "cli/go.mod"
          cache-dependency-path: cli/go.sum

      - name: Download Go dependencies
        working-directory: cli
        run: go mod download

      - name: Cross-build six release targets
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          COMMIT_SHA: ${{ steps.version.outputs.commit_sha }}
          BUILD_TYPE: ${{ steps.version.outputs.build_type }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
        run: |
          for spec in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            bash cli/hack/build-release-artifact.sh "${spec%/*}" "${spec#*/}" cli/dist
          done

      - name: Build npm packages
        run: >-
          node cli/npm/scripts/build-packages.mjs
          --version 0.0.0
          --artifacts cli/dist
          --output "${RUNNER_TEMP}/npm-packages"

      - name: Pack npm packages
        run: |
          node -e '
            const manifest = require(process.env.RUNNER_TEMP + "/npm-packages/publish-manifest.json");
            for (const entry of [...manifest.platformPackages, manifest.rootPackage]) {
              process.stdout.write(entry.directory + "\n");
            }
          ' | while IFS= read -r package_dir; do
            npm pack "$package_dir" --dry-run --json >/dev/null
          done

      - name: Install npm entry package
        run: |
          mkdir -p "${RUNNER_TEMP}/npm-tarballs"
          npm pack "${RUNNER_TEMP}/npm-packages/crater-cli" \
            --pack-destination "${RUNNER_TEMP}/npm-tarballs" >/dev/null
          npm pack "${RUNNER_TEMP}/npm-packages/crater-cli-linux-x64" \
            --pack-destination "${RUNNER_TEMP}/npm-tarballs" >/dev/null
          npm install \
            --prefix "${RUNNER_TEMP}/npm-install" \
            "${RUNNER_TEMP}/npm-tarballs/raids-lab-crater-cli-0.0.0.tgz" \
            "${RUNNER_TEMP}/npm-tarballs/raids-lab-crater-cli-linux-x64-0.0.0.tgz" \
            --offline \
            --ignore-scripts \
            --no-audit \
            --no-fund
          bash cli/hack/smoke-release-binary.sh \
            "${RUNNER_TEMP}/npm-install/node_modules/.bin/crater" \
            linux \
            amd64 \
            development \
            "${{ steps.version.outputs.commit_sha }}" \
            "${{ steps.version.outputs.app_version }}" \
            "${{ steps.version.outputs.build_time }}"
