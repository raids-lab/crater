{{- if and .Values.inferenceMonitoring.enabled .Values.inferenceMonitoring.router.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-inference-router
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: crater
    {{- with .Values.inferenceMonitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - kthena-system
  selector:
    matchLabels:
      {{- toYaml .Values.inferenceMonitoring.router.serviceSelector | nindent 6 }}
  endpoints:
    - port: {{ .Values.inferenceMonitoring.router.port | quote }}
      path: /metrics
      interval: {{ .Values.inferenceMonitoring.interval | quote }}
{{- end }}
