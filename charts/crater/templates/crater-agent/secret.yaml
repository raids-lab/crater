{{- if not .Values.agent.existingSecretName }}
{{- $secretName := "crater-agent-secret" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $token := randAlphaNum 64 | b64enc -}}
{{- $contextSigningKey := randAlphaNum 64 | b64enc -}}
{{- $encryptionKey := randAlphaNum 32 | b64enc -}}
{{- if .Values.agent.internalToken -}}
  {{- $token = .Values.agent.internalToken | b64enc -}}
{{- else if and $existing $existing.data -}}
  {{- $token = index $existing.data "internal-token" -}}
{{- end -}}
{{- if and $existing $existing.data (index $existing.data "context-signing-key") -}}
  {{- $contextSigningKey = index $existing.data "context-signing-key" -}}
{{- end -}}
{{- if and $existing $existing.data (index $existing.data "encryption-key") -}}
  {{- $encryptionKey = index $existing.data "encryption-key" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: crater-agent
type: Opaque
data:
  internal-token: {{ $token | quote }}
  context-signing-key: {{ $contextSigningKey | quote }}
  encryption-key: {{ $encryptionKey | quote }}
{{- end }}
