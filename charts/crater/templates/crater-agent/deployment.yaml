{{- if .Values.agent.enabled }}
{{- $agentSecretName := required "agent.existingSecretName is required when agent.enabled=true" .Values.agent.existingSecretName -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crater-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: crater-agent
spec:
  replicas: {{ .Values.agent.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: crater-agent
  template:
    metadata:
      labels:
        app: crater-agent
      annotations:
        checksum/agent-secret-config: {{ printf "%s:%s" $agentSecretName .Values.agent.secretRevision | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.agent.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: crater-agent
          image: "{{ .Values.images.agent.repository }}:{{ .Values.images.agent.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.agent.securityContext | nindent 12 }}
          env:
            - name: PORT
              value: "8000"
            - name: CRATER_BACKEND_INTERNAL_URL
              value: http://crater-backend-svc
            - name: CRATER_AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $agentSecretName }}
                  key: internal-token
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
