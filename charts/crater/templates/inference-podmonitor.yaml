{{- if .Values.inferenceMonitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}-inference
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: crater
    {{- with .Values.inferenceMonitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.namespaces.job | quote }}
  selector:
    matchLabels:
      crater.raids.io/managed-by: inference-service
      modelserving.volcano.sh/entry: "true"
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.inferenceMonitoring.interval | quote }}
{{- end }}
